# CI Matrix Policy
#
# The package builds on Swift 6.0, the tools-version floor, so consumers on older
# toolchains stay supported. The test suite names its cases with raw identifiers
# (SE-0451), which need a 6.2 or newer compiler, so legs below 6.2 build only.
#
# When bumping the tools-version: drop every leg below it and keep the newest
# toolchain running the tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            swift: "6.0"
            test: false
          - os: macos-15
            swift: "6.2"
            test: true
          - os: macos-26
            swift: "6.2"
            test: true
          - os: macos-26
            swift: "6.3"
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-test-${{ matrix.os }}-swift${{ matrix.swift }}-${{ hashFiles('Package.resolved') }}
      - name: Install liblzma
        run: brew install xz || true
      - name: Build
        run: swift build -v
      - name: Test
        if: matrix.test
        run: swift test -v
  test-ios:
    name: Build for iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2"
      - name: Record toolchain version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: DerivedData
          key: derived-ios-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}
      - name: Build for iOS
        run: |
          xcodebuild build -scheme StreamingLZMA -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData
  documentation:
    name: Build Documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-docs-macos-latest-swift6.2-${{ hashFiles('Package.resolved') }}
      - name: Install liblzma
        run: brew install xz
      - name: Build documentation
        run: |
          swift package --allow-writing-to-directory "$RUNNER_TEMP/docs" \
            generate-documentation --target StreamingLZMA \
            --warnings-as-errors \
            --output-path "$RUNNER_TEMP/docs"
  lint:
    name: Run SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict
  swift-format:
    name: Run swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - uses: actions/checkout@v6
      - name: Download .swift-format config
        run: |
          apt-get update && apt-get install -y wget
          wget -O .swift-format https://gist.githubusercontent.com/RISCfuture/e0c21afb7bd80a88d128a42bf40d2ecd/raw/.swift-format
      - name: Run swift-format lint
        run: swift format lint --strict -r .
